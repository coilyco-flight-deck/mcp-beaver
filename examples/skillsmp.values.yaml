# Example runtime values for a read-only MCP behind a ClusterIP Service.
# Public ingress and authentication are deliberately absent. A deployment
# composes this runtime with its own exposure layer. Consume as:
#
#   helm upgrade --install skillsmp ward-mcp \
#     -f skillsmp.values.yaml \
#     --set-file spec=skillsmp.mcp.kdl \
#     --set image.tag=<built-runtime-sha>
#
# spec rides in via --set-file (the .mcp.kdl body); image.tag is the built
# ward-mcp runtime sha the rollout resolves.
specName: skillsmp

# Pull the run-time token the guardfile names (`value env SKILLSMP_API_KEY`)
# from SSM into the injected env var. A deploy overrides image.repository to the
# in-cluster registry mirror.
secret:
  SKILLSMP_API_KEY: /skillsmp/api-key
