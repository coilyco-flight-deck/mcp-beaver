# Example deploy-side values for a TAILNET-ONLY write MCP.
# Mirrors deploy#46 (forgejo): a write-capable surface, so it stays tailnet-only
# (no public Ingress) - reached over the tailnet by NodePort, never the public
# internet. Consume as:
#
#   helm upgrade --install forgejo-issues ward-mcp \
#     -f forgejo-issues.values.yaml \
#     --set-file spec=forgejo-issues.mcp.kdl \
#     --set image.tag=<built-runtime-sha>
specName: forgejo-issues

# The guardfile names `value env FORGEJO_TOKEN`; pull it from SSM.
secret:
  FORGEJO_TOKEN: /forgejo-mcp/token

# Tailnet-direct local-harness path (deploy#39): reach the pod at
# http://kai-server:30146/mcp with no auth. 30000 + the last three of a chosen
# port; pick a non-colliding value per MCP.
service:
  nodePort: 30146

route:
  # No public route for a write surface: only the tailnet NodePort above.
  public: false
