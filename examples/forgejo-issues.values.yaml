# Example runtime values for a write MCP with an optional NodePort. The
# consuming deployment owns network reachability and authentication. Consume as:
#
#   helm upgrade --install forgejo-issues mcp-beaver \
#     -f forgejo-issues.values.yaml \
#     --set-file spec=forgejo-issues.mcp.kdl \
#     --set image.tag=<built-runtime-sha>
specName: forgejo-issues

# The guardfile names `value env FORGEJO_TOKEN`; pull it from SSM.
secret:
  FORGEJO_TOKEN: /forgejo-mcp/token

# Optional direct node access. The deployment chooses a non-colliding port and
# protects the reachable node surface.
service:
  nodePort: 30146
