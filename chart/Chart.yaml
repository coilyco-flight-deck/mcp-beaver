# appVersion is the generic runtime image tag this chart defaults to. A
# release overrides image.tag with the built runtime sha, and the guardfile it
# serves rides in as chart values rather than a per-server image.
apiVersion: v2
name: mcp-beaver
description: The auth-neutral mcp-beaver distribution chart - one runtime image, a mounted guardfile or exact upstream MCP allowlist, application secret wiring, and a ClusterIP or optional NodePort Service.
type: application
