{{- if eq (include "ward-mcp.hasSsmSecret" .) "true" }}
# One ExternalSecret materializing every string-form `secret` entry (an SSM
# parameter path) into a Secret keyed by the env var name the guardfile's
# `value env <VAR>` references. Map-form entries reference an existing Secret
# and are skipped here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ward-mcp.secretName" . }}
  labels:
    {{- include "ward-mcp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "ward-mcp.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $env, $src := .Values.secret }}
    {{- if kindIs "string" $src }}
    - secretKey: {{ $env }}
      remoteRef:
        key: {{ $src | quote }}
    {{- end }}
    {{- end }}
{{- end }}
