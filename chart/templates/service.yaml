apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-beaver.fullname" . }}
  labels:
    {{- include "mcp-beaver.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # A set nodePort forces NodePort so the optional node-local path binds on
  # every node interface. Unset -> plain ClusterIP.
  type: {{ if .Values.service.nodePort }}NodePort{{ else }}{{ .Values.service.type }}{{ end }}
  selector:
    {{- include "mcp-beaver.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.http.port }}
      targetPort: http
      protocol: TCP
      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
