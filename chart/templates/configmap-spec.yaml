{{- if eq (default "spec" .Values.runtime.mode) "spec" }}
{{- if not .Values.spec }}
{{- fail "mcp-beaver: .Values.spec is empty - supply the guardfile with `--set-file spec=<name>.mcp.kdl`" }}
{{- end }}
# The .mcp.kdl guardfile, mounted into the runtime at {{ include "mcp-beaver.specPath" . }}.
# This is the ONLY per-MCP artifact; the runtime image is shared across releases.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-beaver.fullname" . }}-spec
  labels:
    {{- include "mcp-beaver.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{ include "mcp-beaver.specName" . }}.mcp.kdl: |
    {{- .Values.spec | nindent 4 }}
{{- end }}
