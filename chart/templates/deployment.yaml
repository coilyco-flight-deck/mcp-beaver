{{- $mode := default "spec" .Values.runtime.mode -}}
{{- if not (has $mode (list "spec" "upstream")) -}}
{{- fail (printf "mcp-beaver: unsupported runtime.mode %q (want spec or upstream)" $mode) -}}
{{- end -}}
{{- $specMounted := include "mcp-beaver.mountsSpec" . -}}
{{- if eq $mode "upstream" -}}
{{- if $specMounted -}}
{{- $stated := list -}}
{{- if .Values.upstream.url -}}{{- $stated = append $stated "upstream.url" -}}{{- end -}}
{{- if .Values.upstream.name -}}{{- $stated = append $stated "upstream.name" -}}{{- end -}}
{{- if .Values.upstream.tools -}}{{- $stated = append $stated "upstream.tools" -}}{{- end -}}
{{- if .Values.upstream.headers -}}{{- $stated = append $stated "upstream.headers" -}}{{- end -}}
{{- if .Values.upstream.oauth2Clients -}}{{- $stated = append $stated "upstream.oauth2Clients" -}}{{- end -}}
{{- if $stated -}}
{{- fail (printf "mcp-beaver: upstream mode takes `spec` or %s, not both - the guardfile already states them, and serve-upstream refuses the same pair" (join ", " $stated)) -}}
{{- end -}}
{{- else -}}
{{- if not .Values.upstream.url -}}
{{- fail "mcp-beaver: upstream mode needs .Values.upstream.url, or a `spec` carrying an `mcp-upstream` guardfile" -}}
{{- end -}}
{{- if eq (len .Values.upstream.tools) 0 -}}
{{- fail "mcp-beaver: upstream mode needs at least one .Values.upstream.tools entry" -}}
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-beaver.fullname" . }}
  labels:
    {{- include "mcp-beaver.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "mcp-beaver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-beaver.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/runtime: {{ dict "mode" $mode "upstream" .Values.upstream "extraContainers" .Values.extraContainers | toJson | sha256sum }}
        {{- if $specMounted }}
        # Roll the pod whenever the mounted guardfile changes - a ConfigMap
        # edit alone does not restart a running container.
        checksum/spec: {{ .Values.spec | sha256sum }}
        {{- if .Values.apiDocument }}
        checksum/api-document: {{ .Values.apiDocument | sha256sum }}
        {{- end }}
        {{- end }}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-beaver
          image: {{ include "mcp-beaver.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            {{- if eq $mode "upstream" }}
            - serve-upstream
            {{- if $specMounted }}
            # A guardfile states the endpoint, the allowlist, the credential,
            # and the server's own name, so the only flags left are the ones
            # serve-upstream still takes beside a file.
            - {{ include "mcp-beaver.specPath" . }}
            - --connect-timeout
            - {{ .Values.upstream.connectTimeout | quote }}
            {{- else }}
            - --name
            - {{ default (include "mcp-beaver.fullname" .) .Values.upstream.name | quote }}
            - --upstream
            - {{ .Values.upstream.url | quote }}
            - --connect-timeout
            - {{ .Values.upstream.connectTimeout | quote }}
            {{- range .Values.upstream.tools }}
            - --tool
            - {{ . | quote }}
            {{- end }}
            {{- range .Values.upstream.oauth2Clients }}
            - --oauth2-client
            - {{ . | quote }}
            {{- end }}
            {{- range .Values.upstream.headers }}
            - --upstream-header
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- else }}
            - serve
            - {{ include "mcp-beaver.specPath" . }}
            {{- end }}
            - --http
            - :{{ .Values.http.port }}
          ports:
            - name: http
              containerPort: {{ .Values.http.port }}
          {{- if or (and .Values.runtime.injectSecrets (gt (len .Values.secret) 0)) (gt (len .Values.extraEnv) 0) }}
          env:
            {{- if .Values.runtime.injectSecrets }}
            {{- range $env, $src := .Values.secret }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  {{- if kindIs "string" $src }}
                  name: {{ include "mcp-beaver.secretName" $ }}
                  key: {{ $env }}
                  {{- else }}
                  name: {{ $src.secretName }}
                  key: {{ $src.key }}
                  {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if $specMounted }}
          volumeMounts:
            - name: spec
              mountPath: /spec
              readOnly: true
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if $specMounted }}
      volumes:
        - name: spec
          configMap:
            name: {{ include "mcp-beaver.fullname" . }}-spec
            # Enumerated rather than projected whole: a widget key is flattened
            # in the ConfigMap and has to land back at the nested path the
            # guardfile's `app file=` names.
            items:
              {{- include "mcp-beaver.specItems" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
